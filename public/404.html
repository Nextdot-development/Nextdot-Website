<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — Nextdot</title>
    <style>
      :root { color-scheme: light; }
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #faf9f6; color: #1a1a1a; min-height: 100vh;
        display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
      }
      .wrap { max-width: 520px; }
      .code { font-size: 5rem; font-weight: 800; letter-spacing: -0.03em; color: #c8102e; line-height: 1; }
      h1 { font-size: 1.6rem; font-weight: 700; margin: 16px 0 8px; letter-spacing: -0.01em; }
      p { color: rgba(26,26,26,0.65); font-size: 1.05rem; line-height: 1.6; }
      .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block; text-decoration: none; font-weight: 600; font-size: 0.95rem;
        padding: 12px 22px; border-radius: 9999px; transition: all 0.15s ease;
      }
      .primary { background: #1a1a1a; color: #faf9f6; }
      .primary:hover { background: #000; }
      .ghost { border: 1px solid rgba(26,26,26,0.15); color: #1a1a1a; }
      .ghost:hover { border-color: #c8102e; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>This page has moved on</h1>
      <p>The page you're looking for doesn't exist anymore. It may have been part of our older site. Let's get you back on track.</p>
      <div class="actions">
        <a class="primary" href="/">Go to homepage</a>
        <a class="ghost" href="/blogs">Read the blog</a>
      </div>
    </div>
  </body>
</html>
